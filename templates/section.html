{% extends "base.html" %}

{% block metadata %}
<title>{{ config.author }} - {{ section.title }}</title>
<meta name="description" content="{% if section.description %}{{ section.description }}{% else %}{{ section.title }}{% endif %}">
{% endblock %}

{% block content %} 
<h1>{{ section.title | safe }}</h1>
{{ section.content | safe }}
{% endblock content %}
